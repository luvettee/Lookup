[project]
name = "lookup-mcp"
version = "2.1.0"
description = "Lightweight MCP server for web and torrent search, page reading, research, news, weather, time, calculations, and unit conversion"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Lookup"},
]
keywords = ["mcp", "search", "web", "lm-studio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = []

[project.scripts]
lookup-mcp = "Search:main"

[project.optional-dependencies]
ollama = ["ollama>=0.1.0"]
tavily = ["tavily-python>=0.3.0"]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/luvettee/Lookup"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["Search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
