[package]
name = "lookup"
version = "2.2.0"
edition = "2021"
authors = ["luvettee"]
description = "Lookup is a lightweight MCP server for web and torrent search, page reading, research, news, weather, time, calculations, and unit conversion."
license = "MIT"
readme = "README.md"

[dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "process", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli", "deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
scraper = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
regex = "1.11"
sha1 = "0.10"
data-encoding = "2.7"
url = "2.5"
quick-xml = "0.37"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
futures = "0.3"
tokio-stream = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3.15"
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "handshake"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
